name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r src data _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  update-readme:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the live site link in the README
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          python3 - <<'PY'
          import os
          import re

          url = os.environ["PAGE_URL"].rstrip("/") + "/"
          block = f"**Live site:** <{url}>\n"
          readme = open("README.md", encoding="utf-8").read()
          updated = re.sub(
              r"(?s)(<!-- live-site:start -->\n).*?(<!-- live-site:end -->)",
              lambda m: m.group(1) + block + m.group(2),
              readme,
          )
          if updated != readme:
              open("README.md", "w", encoding="utf-8").write(updated)
          PY
      - name: Commit if the README changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: update live site link [skip ci]" README.md
            git push
          fi
